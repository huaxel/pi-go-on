name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit
      - run: npm pack --dry-run
      - run: bash -n scripts/*.sh
      - run: ./scripts/verify-load.sh
      - run: VERIFY_FROM_TARBALL=1 ./scripts/verify-load.sh
