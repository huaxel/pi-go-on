name: Publish to npm

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Publishing is irreversible for a given version, so serialize release runs
# instead of letting two dispatches race the republish guard.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit
      - run: npm pack --dry-run
      - run: bash -n scripts/*.sh
      - run: ./scripts/verify-load.sh
      - run: VERIFY_FROM_TARBALL=1 ./scripts/verify-load.sh
      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          ENCODED=$(node -p "encodeURIComponent(require('./package.json').name)")
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$ENCODED/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "::error::$PACKAGE@$VERSION already exists on npm; bump the version before publishing."
            exit 1
          fi
          if [ "$CODE" != "404" ]; then
            echo "::error::Registry lookup for $PACKAGE@$VERSION returned HTTP $CODE; refusing to publish."
            exit 1
          fi
          echo "$PACKAGE@$VERSION is unpublished; proceeding."
      - run: npm publish --access public
